name: DigiOps Release - Ananta

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ananta-digiops-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package /ananta/
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, gd, curl, openssl, sodium, zip
          coverage: none

      - name: Install optional visual-intelligence test dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for sandbox visual intelligence tests
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'

      - name: Reject committed runtime secrets and mutable state
        run: |
          forbidden="$(git ls-files -- storage/private-domain storage/journals storage/locks storage/indexes | grep -Ev '/\.keep
        run: bash scripts/full_regression.sh

      - name: Restore committed public-domain seed after mutable regression fixtures
        run: git restore --source=HEAD --worktree -- storage/public-domain/

      - name: Build DigiOps split public/private artifact
        run: php tools/package-digiops-release.php

      - name: Verify artifact contents and privacy boundary
        run: php tools/check-digiops-release.php

      - name: Smoke test Cloudways sibling-path installation
        run: bash tools/smoke-digiops-layout.sh

      - name: Upload DigiOps release artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
 || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Tracked runtime data detected in the working tree."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Full regression suite
        run: bash scripts/full_regression.sh

      - name: Restore committed public-domain seed after mutable regression fixtures
        run: git restore --source=HEAD --worktree -- storage/public-domain/

      - name: Build DigiOps split public/private artifact
        run: php tools/package-digiops-release.php

      - name: Verify artifact contents and privacy boundary
        run: php tools/check-digiops-release.php

      - name: Smoke test Cloudways sibling-path installation
        run: bash tools/smoke-digiops-layout.sh

      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
