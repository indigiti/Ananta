name: Ananta PHP regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, gd, curl, openssl, sodium
          coverage: none
      - name: Install optional visual-intelligence test dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for sandbox visual intelligence tests
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'

      - name: Reject committed runtime secrets and mutable state
        run: |
          forbidden="$(git ls-files -- storage/private-domain storage/journals storage/locks storage/indexes | grep -Ev '/[.]keep($)' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Tracked runtime data detected in the working tree."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Lint all PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Full file-first regression
        run: bash scripts/full_regression.sh
