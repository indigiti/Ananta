server {
    listen 80;
    server_name staging.example.com;
    root /var/www/sanjay_nursery_staging_v1.7.0/public;
    index index.php;

    # Terminate TLS at Nginx or a trusted upstream proxy before real staging use.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Versioned/static storefront assets: avoid repeated PHP/Nginx work on every page view.
    location ~* ^/assets/.*\.(?:css|js|png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:env|ini|log|sql|bak|dist|md|json)$ { deny all; }
}
